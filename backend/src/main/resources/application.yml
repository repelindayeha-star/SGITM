spring:
  application:
    name: motonexus-backend

  datasource:
    # Neon PostgreSQL - reemplazar por la cadena real del proyecto (nunca commitear la real; usar variables de entorno / .env)
    url: ${DB_URL:jdbc:postgresql://ep-xxxxx.us-east-2.aws.neon.tech/motonexus?sslmode=require}
    username: ${DB_USER:por_definir}
    password: ${DB_PASSWORD:por_definir}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # nunca 'update' ni 'create' en un proyecto real: el esquema lo controla Flyway (DAT-03)
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:por_definir}
    password: ${MAIL_PASSWORD:por_definir}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: ${SERVER_PORT:8080}

app:
  security:
    jwt:
      secret: ${JWT_SECRET:CAMBIAR_ESTE_SECRETO_POR_UNO_REAL_DE_AL_MENOS_256_BITS}
      expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
      cookie-name: motonexus_token
    verification-code:
      expiration-minutes: 10
      max-attempts: 5
    recaptcha:
      secret: ${RECAPTCHA_SECRET:por_definir}
      site-key: ${RECAPTCHA_SITE_KEY:por_definir}
  google:
    client-id: ${GOOGLE_CLIENT_ID:por_definir}
  cors:
    allowed-origins: ${FRONTEND_ORIGIN:http://localhost:5173}

logging:
  level:
    com.sigtm.backend: INFO
    org.springframework.security: INFO
